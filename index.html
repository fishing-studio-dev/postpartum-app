<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://apis.google.com; frame-src https://sango-app-a7e00.firebaseapp.com https://accounts.google.com https://apis.google.com; img-src 'self' data: blob:; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fff6ec">
<meta name="application-name" content="産後アプリ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="産後アプリ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>産後アプリ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./mascot.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<section id="loading" class="screen center">
<img class="mascot-big bob" src="./mascot.svg" alt="" width="120" height="120">
</section>

<section id="login" class="screen center" hidden>
<img class="mascot-big" src="./mascot.svg" alt="" width="140" height="140">
<h1 class="app-title">産後アプリ</h1>
<button id="login-btn" type="button" class="big">Googleでログイン</button>
<p id="login-msg" class="login-msg" role="status" aria-live="polite"></p>
</section>

<div id="app" class="app" hidden>
<header class="top">
<img class="mascot-mini" src="./mascot.svg" alt="" width="32" height="32">
<span class="top-title">産後アプリ</span>
<button id="gear" type="button" class="icon-btn" aria-label="設定">⚙</button>
</header>
<p id="offline-pill" class="pill" role="status" hidden></p>
<p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

<main>
<section id="tab-todo" class="tab">
<h2 class="section-title">次にやること</h2>
<div id="chips" class="chips" role="group" aria-label="分類"></div>
<ul id="todo-list" class="list"></ul>
<div id="todo-empty" class="empty" hidden><img class="mascot-mid" src="./mascot.svg" alt="" width="88" height="88"><p>やることはありません</p></div>
<button id="done-toggle" type="button" class="soft-btn">完了</button>
<ul id="done-list" class="list done-list" hidden></ul>
<button id="add-btn" type="button" class="fab" aria-label="追加">＋</button>
</section>

<section id="tab-photos" class="tab" hidden>
<label class="big photo-add">写真を追加<input id="photo-input" class="visually-hidden" type="file" accept="image/*" multiple></label>
<p id="photo-status" class="hint" role="status" aria-live="polite"></p>
<ul id="photo-grid" class="grid"></ul>
<div id="photo-empty" class="empty" hidden><img class="mascot-mid" src="./mascot.svg" alt="" width="88" height="88"><p>写真はまだありません</p></div>
</section>
</main>

<p class="foot">医療の判断は医療機関・自治体に確認してください</p>
<nav class="tabs" aria-label="画面">
<button id="tab-btn-todo" type="button" class="tab-btn" aria-selected="true">やること</button>
<button id="tab-btn-photos" type="button" class="tab-btn" aria-selected="false">写真</button>
</nav>
</div>

<section id="detail" class="overlay" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
<div class="sheet">
<h2 id="d-title" class="sheet-title"></h2>
<p id="d-date" class="d-date"></p>
<p id="d-cond" class="d-cond" hidden></p>
<p id="d-rule" class="small"></p>
<div class="d-block"><h3>場所</h3><p id="d-place"></p></div>
<div class="d-block"><h3>持ち物・書類</h3><ul id="d-docs" class="docs"></ul></div>
<p id="d-note" class="small"></p>
<div class="d-block"><h3>メモ</h3><textarea id="d-memo" rows="3" maxlength="2000" aria-label="メモ"></textarea><button id="d-memo-save" type="button" class="soft-btn">メモを保存</button></div>
<a id="d-link" class="link-btn" target="_blank" rel="noopener noreferrer" hidden>公式リンク</a>
<button id="d-done" type="button" class="big">完了にする</button>
<p id="d-done-by" class="small center-text"></p>
<div class="row-actions"><button id="d-edit" type="button" class="soft-btn">編集</button><button id="d-delete" type="button" class="soft-btn danger">削除</button><button id="d-close" type="button" class="soft-btn">閉じる</button></div>
</div>
</section>

<section id="editor" class="overlay" role="dialog" aria-modal="true" aria-labelledby="e-heading" hidden>
<div class="sheet">
<h2 id="e-heading" class="sheet-title">追加</h2>
<label class="field">タイトル<input id="e-title" type="text" maxlength="80" autocomplete="off"></label>
<label class="field">日付<input id="e-date" type="date" min="2025-01-01" max="2030-12-31"></label>
<label class="field">分類<select id="e-category"></select></label>
<label class="field">場所<input id="e-place" type="text" maxlength="200" autocomplete="off"></label>
<label class="field">持ち物・書類（1行に1つ）<textarea id="e-docs" rows="3"></textarea></label>
<label class="field">メモ<textarea id="e-memo" rows="3" maxlength="2000"></textarea></label>
<label class="field">リンク<input id="e-link" type="url" inputmode="url" maxlength="500" autocomplete="off" placeholder="https://"></label>
<p id="e-error" class="error" role="alert"></p>
<div class="row-actions"><button id="e-save" type="button" class="big">保存</button><button id="e-cancel" type="button" class="soft-btn">やめる</button></div>
</div>
</section>

<section id="settings" class="overlay" role="dialog" aria-modal="true" aria-labelledby="s-heading" hidden>
<div class="sheet">
<h2 id="s-heading" class="sheet-title">設定</h2>
<label class="field">出生日<input id="s-birth" type="date" min="2025-01-01" max="2028-12-31"></label>
<p id="s-due" class="small"></p>
<div class="row-actions"><button id="s-save" type="button" class="big">保存</button><button id="s-clear" type="button" class="soft-btn">予定日で計算</button></div>
<div class="row-actions"><button id="s-logout" type="button" class="soft-btn">ログアウト</button><button id="s-close" type="button" class="soft-btn">閉じる</button></div>
</div>
</section>

<section id="viewer" class="overlay" role="dialog" aria-modal="true" aria-label="写真" hidden>
<div class="sheet">
<img id="v-img" class="viewer-img" alt="写真">
<p id="v-by" class="small center-text"></p>
<div class="row-actions"><button id="v-delete" type="button" class="soft-btn danger">削除</button><button id="v-close" type="button" class="soft-btn">閉じる</button></div>
</div>
</section>
<script src="./firebase-config.js"></script>
<script type="module" src="./app.js"></script>
</body></html>
